name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unifi-keypad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python tests
        run: python -m unittest discover -v
      - name: JavaScript tests
        run: |
          for test in test_*.cjs; do node "$test" || exit 1; done
      - name: Installer shell syntax
        run: |
          for script in start-panel.sh deploy/pi/*.sh; do bash -n "$script"; done

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astra-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: node --check static/portal.js
